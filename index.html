
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مؤسسة الملك التجارية</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #080808;
      color: white;
      text-align: center;
    }

    .container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 25px;
    }

    .logo {
      color: #d4af37;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 35px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 35px 22px;
      background: #151515;
      border: 1px solid #b89532;
      border-radius: 22px;
      box-shadow: 0 0 25px #b8953215;
    }

    h1 {
      color: #d4af37;
      font-size: 25px;
      margin-bottom: 15px;
    }

    p {
      color: #ccc;
      line-height: 1.8;
    }

    .download {
      display: block;
      margin-top: 30px;
      padding: 17px;
      background: linear-gradient(135deg, #f1d477, #b89532);
      color: #111;
      text-decoration: none;
      font-weight: bold;
      font-size: 18px;
      border-radius: 12px;
    }

    .download:active {
      transform: scale(0.97);
    }

    .note {
      font-size: 13px;
      margin-top: 20px;
      color: #999;
    }

    footer {
      margin-top: 35px;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="logo">مؤسسة الملك التجارية</div>

    <div class="card">
      <h1>تطبيق مؤسسة الملك</h1>

      <p>
        حمّل تطبيقنا الآن واستمتع بتجربة تسوق
        سهلة وسريعة من هاتفك.
      </p>

      <a class="download" href="king-store.apk" download>
        ⬇ تحميل التطبيق الآن
      </a>

      <div class="note">
        التطبيق متوفر لأجهزة Android
      </div>
    </div>

    <footer>
      © مؤسسة الملك التجارية
    </footer>
  </div>
</body>
</html>
